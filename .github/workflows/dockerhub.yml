name: Build and publish rEda image

on:
  push:
    branches:
      - reda-custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-reda-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/reteambiente/reda

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=rEda
            org.opencontainers.image.description=Custom-branded Open WebUI for rEda

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=reda-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
