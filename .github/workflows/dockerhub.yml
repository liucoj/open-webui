name: Build and publish rEda image

on:
  push:
    branches:
      - reda-custom
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-reda-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: docker.io/reteambiente/reda

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
            pair: linux-amd64
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
            pair: linux-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare Dockerfile for CI
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for ${{ matrix.platform.arch }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          platforms: ${{ matrix.platform.arch }}
          labels: |
            org.opencontainers.image.title=rEda
            org.opencontainers.image.description=Custom-branded Open WebUI for rEda
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=reda-${{ matrix.platform.pair }}
          cache-to: type=gha,scope=reda-${{ matrix.platform.pair }},mode=max
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=reda-custom

      - name: Export image digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Publish multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
